<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticker Rain</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
      #site-content {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
        opacity: 0.24;
        pointer-events: none;
      }
      #fireworks { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
    </style>
  </head>
  <body>
    <iframe
      id="site-content"
      src="https://ysyx.200502.xyz/"
      title="一生一芯"
    ></iframe>
    <canvas id="stage"></canvas>
    <canvas id="fireworks" aria-hidden="true"></canvas>

    <script>
      let fallingEnabled = true;
      let stickerMesh = null;
      let burstHandler = null;
      let fireworks = null;
      const fireworksCanvas = document.getElementById("fireworks");
      const fireworksContext = fireworksCanvas.getContext("2d");
      function resizeFireworks() { const ratio = Math.min(window.devicePixelRatio || 1, 2); fireworksCanvas.width = window.innerWidth * ratio; fireworksCanvas.height = window.innerHeight * ratio; fireworksContext.setTransform(ratio, 0, 0, ratio, 0, 0); }
      function stopFireworks() { fireworks = null; fireworksContext.clearRect(0, 0, window.innerWidth, window.innerHeight); }
      function startFireworks() { if (fireworks) return; fireworks = { started: performance.now(), rockets: [], sparks: [] }; for (let i = 0; i < 18; i++) fireworks.rockets.push({ x: window.innerWidth * (0.04 + Math.random() * 0.92), y: window.innerHeight + 20, target: window.innerHeight * (0.08 + Math.random() * 0.62), speed: 5 + Math.random() * 3, hue: Math.floor(Math.random() * 360) }); requestAnimationFrame(drawFireworks); }
      function drawFireworks(now) { if (!fireworks) return; const elapsed = now - fireworks.started; if (elapsed >= 10000) return stopFireworks(); const ctx = fireworksContext; ctx.fillStyle = "rgba(5, 8, 20, 0.16)"; ctx.fillRect(0, 0, window.innerWidth, window.innerHeight); ctx.globalCompositeOperation = "lighter"; fireworks.rockets = fireworks.rockets.filter((r) => { r.y -= r.speed; ctx.fillStyle = `hsla(${r.hue}, 100%, 75%, .95)`; ctx.fillRect(r.x - 1, r.y, 2, 12); if (r.y > r.target) return true; for (let i = 0; i < 72; i++) { const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 5; fireworks.sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, hue: r.hue + Math.random() * 45 }); } return false; }); fireworks.sparks = fireworks.sparks.filter((s) => { s.x += s.vx; s.y += s.vy; s.vy += .045; s.vx *= .985; s.life -= .014; ctx.fillStyle = `hsla(${s.hue}, 100%, 70%, ${s.life})`; ctx.beginPath(); ctx.arc(s.x, s.y, 1.6, 0, Math.PI * 2); ctx.fill(); return s.life > 0; }); ctx.globalCompositeOperation = "source-over"; if (elapsed > 1200 && fireworks.rockets.length < 7) fireworks.rockets.push({ x: window.innerWidth * (0.04 + Math.random() * 0.92), y: window.innerHeight + 20, target: window.innerHeight * (0.08 + Math.random() * 0.68), speed: 5 + Math.random() * 3, hue: Math.floor(Math.random() * 360) }); requestAnimationFrame(drawFireworks); }
      resizeFireworks(); window.addEventListener("resize", resizeFireworks); window.addEventListener("keydown", (event) => { if (event.code === "Space" && fireworks) { event.preventDefault(); stopFireworks(); } });
      const siteFrame = document.getElementById("site-content");

      window.addEventListener("message", (event) => {
        if (
          event.source !== siteFrame.contentWindow ||
          event.origin !== "https://ysyx.200502.xyz"
        ) {
          return;
        }

        if (event.data?.type === "sticker-login-success") {
          fallingEnabled = false;
          if (stickerMesh) stickerMesh.visible = false;
        }
        if (event.data?.type === "sticker-timer-start") {
          fallingEnabled = true;
          if (stickerMesh) stickerMesh.visible = true;
        }
        if (event.data?.type === "sticker-timer-stop") {
          fallingEnabled = false;
          if (stickerMesh) stickerMesh.visible = false;
          if (event.data.completed || event.data.elapsed >= 15 * 60 * 60) startFireworks();
        }
        if (["sticker-timer-complete", "sticker-fireworks", "sticker-firework"].includes(event.data?.type)) startFireworks();
        if (event.data?.type === "sticker-logout") {
          fallingEnabled = true;
          if (stickerMesh) stickerMesh.visible = true;
        }
        if (
          event.data?.type === "sticker-burst" &&
          fallingEnabled &&
          burstHandler
        ) {
          burstHandler(event.data);
        }
      });
    </script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";

      // 1. 固定的核心参数配置
      const CONFIG = {
        poolSize: 16, // 同屏随机掉落的贴纸实例总数
        spawnWidth: 32, // 横向生成范围
        spawnHeight: 24, // 纵向生成范围
        positionY: 24, // 粒子重新出现时的顶部 Y 坐标
        fallDistance: 48, // 粒子从顶部落到底部所经过的距离
        zDepth: 4, // 粒子在 Z 轴上的随机深度范围
        zOffset: -6, // 粒子 Z 轴基准偏移
        windStrength: 1.8, // 风力摆动幅度
        windFrequency: 0.3, // 风力摆动频率
        scale: 3, // 贴纸基础缩放
        rotationSpeed: 0.8, // 旋转速度
        fallSpeed: 1.8, // 下落速度
      };

      // 2. 你的真实 PNG 贴纸图片路径（已帮你物归原主）
      const STICKER_URLS = [
        "img/s_03.png",
        "img/s_05.png",
        "img/s_08.png",
        "img/s_10.png",
        "img/scau_emblem.png",
        "img/ICIL_logo_transparent.png",
        "img/ysyx_logo.png",
        "img/coding_vscode.png",
        "img/coding_github.png",
        "img/coding_linux.png",
      ];
      const FEATURED_STICKER_START = 4;
      const CODING_STICKER_START = 7;

      Object.assign(CONFIG, {
        poolSize: 20,
        spawnWidth: 38,
        windStrength: 0.18,
        windFrequency: 0.18,
        scale: 2.4,
        codingScale: 3.05,
        featuredScale: 3.7,
        featuredChance: 0.22,
        featuredMax: 3,
        edgeLaneChance: 0.42,
        edgeLaneStart: 0.62,
        overlapPadding: 0.58,
        separationStrength: 0.08,
        burstRadius: 6.5,
        burstForce: 7,
        burstDamping: 0.9,
        fallSpeed: 0.95,
        rotationSpeed: 0.2,
      });

      const VERTEX_SHADER = /* glsl */ `
        attribute vec4 uvRect;
        varying vec2 vAtlasUv;
        void main() {
          vAtlasUv = uvRect.xy + uv * uvRect.zw;
          vec4 mvPosition = modelViewMatrix * instanceMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mvPosition;
        }
      `;

      const FRAGMENT_SHADER = /* glsl */ `
        uniform sampler2D map;
        varying vec2 vAtlasUv;
        void main() {
          vec4 color = texture2D(map, vAtlasUv);
          if (color.a < 0.01) discard;
          gl_FragColor = color;
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }
      `;

      // 3. 基础场景搭建
      const canvas = document.getElementById("stage");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        200,
      );

      function fitCamera() {
        const aspect = window.innerWidth / window.innerHeight;
        const vFovHalf = (camera.fov * Math.PI) / 180 / 2;
        const hTanHalf = Math.tan(vFovHalf) * aspect;
        const distance = CONFIG.spawnWidth / 2 / hTanHalf;

        camera.position.set(0, 0, distance);
        camera.aspect = aspect;
        camera.updateProjectionMatrix();
      }

      window.addEventListener("resize", () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        fitCamera();
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      fitCamera();

      // 4. 图片异步加载与图集（Atlas）拼合逻辑
      function loadImage(url) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => {
            console.warn(
              `[Sticker Rain] 无法加载图片: ${url}，将生成临时占位块`,
            );
            // 兜底：如果某张图 404，生成一个透明底的红色方块，不至于让整个程序崩溃
            const c = document.createElement("canvas");
            c.width = 256;
            c.height = 256;
            const ctx = c.getContext("2d");
            resolve(c);
          };
          img.src = url;
        });
      }

      async function buildAtlas(urls) {
        const images = await Promise.all(urls.map(loadImage));
        const cols = 4;
        const rows = Math.ceil(urls.length / cols);
        const cell = 256; // 假定单张贴纸解析度上限基准为 256x256

        const atlasCanvas = document.createElement("canvas");
        atlasCanvas.width = cols * cell;
        atlasCanvas.height = rows * cell;
        const ctx = atlasCanvas.getContext("2d");
        const uvRects = [];

        images.forEach((img, i) => {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const cx = col * cell;
          const cy = row * cell;

          // 保持贴纸比例居中绘制到图集网格中
          const scale = Math.min(cell / img.width, cell / img.height) * 0.9;
          const dw = img.width * scale;
          const dh = img.height * scale;
          const dx = cx + (cell - dw) / 2;
          const dy = cy + (cell - dh) / 2;
          ctx.drawImage(img, dx, dy, dw, dh);

          // 计算该图片在图集中的标准化 UV 坐标区间
          uvRects.push([
            cx / atlasCanvas.width,
            1 - (row + 1) / rows,
            cell / atlasCanvas.width,
            cell / atlasCanvas.height,
          ]);
        });

        const texture = new THREE.CanvasTexture(atlasCanvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        return { texture, uvRects };
      }

      // 5. 初始化核心流与运行循环
      async function init() {
        const { texture, uvRects } = await buildAtlas(STICKER_URLS);

        const material = new THREE.ShaderMaterial({
          uniforms: { map: { value: texture } },
          vertexShader: VERTEX_SHADER,
          fragmentShader: FRAGMENT_SHADER,
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
        });

        const geometry = new THREE.PlaneGeometry(1, 1);
        const uvRectAttr = new THREE.InstancedBufferAttribute(
          new Float32Array(CONFIG.poolSize * 4),
          4,
        );
        geometry.setAttribute("uvRect", uvRectAttr);

        const mesh = new THREE.InstancedMesh(
          geometry,
          material,
          CONFIG.poolSize,
        );
        mesh.frustumCulled = false;
        mesh.visible = fallingEnabled;
        stickerMesh = mesh;
        scene.add(mesh);

        const particles = new Array(CONFIG.poolSize);

        function spawnParticle(p, index, initial) {
          const featuredCount = particles.reduce((count, other) => {
            return count + (other && other !== p && other.featured ? 1 : 0);
          }, 0);
          const featured =
            featuredCount < CONFIG.featuredMax &&
            Math.random() < CONFIG.featuredChance;
          const standardOrCodingIndex = Math.floor(
            Math.random() * (FEATURED_STICKER_START + 3),
          );
          const coding =
            !featured && standardOrCodingIndex >= FEATURED_STICKER_START;
          const stickerIndex = featured
            ? FEATURED_STICKER_START + Math.floor(Math.random() * 3)
            : standardOrCodingIndex < FEATURED_STICKER_START
              ? standardOrCodingIndex
              : CODING_STICKER_START +
                standardOrCodingIndex -
                FEATURED_STICKER_START;
          const [u, v, w, h] = uvRects[stickerIndex];
          uvRectAttr.setXYZW(index, u, v, w, h);

          const baseScale = featured
            ? CONFIG.featuredScale
            : coding
              ? CONFIG.codingScale
              : CONFIG.scale;
          p.scale = baseScale * (0.85 + Math.random() * 0.3);

          const spawnY = initial
            ? CONFIG.positionY - Math.random() * CONFIG.fallDistance
            : CONFIG.positionY + Math.random() * 3;
          let spawnX = 0;
          for (let attempt = 0; attempt < 40; attempt++) {
            const halfWidth = CONFIG.spawnWidth / 2;
            const edgePadding = Math.min(p.scale * 0.45, halfWidth * 0.12);
            const usableHalfWidth = halfWidth - edgePadding;
            const edgeStart = usableHalfWidth * CONFIG.edgeLaneStart;
            const candidateX = Math.random() < CONFIG.edgeLaneChance
              ? (Math.random() < 0.5 ? -1 : 1) *
                (edgeStart + Math.random() * (usableHalfWidth - edgeStart))
              : (Math.random() - 0.5) * edgeStart * 2;
            const overlaps = particles.some((other) => {
              if (!other || other === p) return false;
              const clearance =
                (p.scale + other.scale) * CONFIG.overlapPadding;
              return (
                Math.abs(other.x - candidateX) < clearance &&
                Math.abs(other.y - spawnY) < clearance * 0.72
              );
            });
            spawnX = candidateX;
            if (!overlaps) break;
          }

          p.x = spawnX;
          p.y = spawnY;
          p.z = CONFIG.zOffset + Math.random() * CONFIG.zDepth;
          p.featured = featured;
          p.velocityX = 0;
          p.velocityY = 0;
          p.rotation = Math.random() * Math.PI * 2;
          p.rotationDir = Math.random() < 0.5 ? -1 : 1;
          p.windPhase = Math.random() * Math.PI * 2;
          p.speedMul = featured
            ? 0.9 + Math.random() * 0.25
            : 0.55 + Math.random() * 0.3;
        }

        for (let i = 0; i < CONFIG.poolSize; i++) {
          particles[i] = {};
          spawnParticle(particles[i], i, true);
        }
        uvRectAttr.needsUpdate = true;

        burstHandler = ({ x, y }) => {
          const normalizedX = Number(x);
          const normalizedY = Number(y);
          if (!Number.isFinite(normalizedX) || !Number.isFinite(normalizedY)) {
            return;
          }

          const clickX =
            (Math.max(0, Math.min(1, normalizedX)) - 0.5) *
            CONFIG.spawnWidth;
          const visibleHeight = CONFIG.spawnWidth / camera.aspect;
          const clickY =
            (0.5 - Math.max(0, Math.min(1, normalizedY))) * visibleHeight;

          particles.forEach((p, index) => {
            let dx = p.x - clickX;
            let dy = p.y - clickY;
            let distance = Math.hypot(dx, dy);
            const hitRadius = p.scale * 0.55;
            const effectRadius = CONFIG.burstRadius + hitRadius;
            if (distance >= effectRadius) return;

            if (distance < 0.001) {
              const angle = (index / particles.length) * Math.PI * 2;
              dx = Math.cos(angle);
              dy = Math.sin(angle);
              distance = 1;
            }

            const influence = 1 - distance / effectRadius;
            const directHitBoost = distance <= hitRadius ? 1.35 : 1;
            const force =
              CONFIG.burstForce *
              (0.25 + influence * 0.75) *
              directHitBoost;
            p.velocityX += (dx / distance) * force;
            p.velocityY += (dy / distance) * force;
          });
        };

        function separateParticles() {
          for (let i = 0; i < particles.length; i++) {
            const a = particles[i];
            for (let j = i + 1; j < particles.length; j++) {
              const b = particles[j];
              const dx = a.x - b.x;
              const dy = Math.abs(a.y - b.y);
              const minDistance =
                (a.scale + b.scale) * CONFIG.overlapPadding;
              const verticalDistance = minDistance * 0.72;

              if (Math.abs(dx) >= minDistance || dy >= verticalDistance) {
                continue;
              }

              const direction = dx === 0 ? (i % 2 ? 1 : -1) : Math.sign(dx);
              const verticalFactor = 1 - dy / verticalDistance;
              const push =
                (minDistance - Math.abs(dx)) *
                verticalFactor *
                CONFIG.separationStrength;
              a.x += direction * push;
              b.x -= direction * push;
            }
          }

          const halfWidth = CONFIG.spawnWidth / 2;
          particles.forEach((p) => {
            const limit = Math.max(0, halfWidth - p.scale * 0.5);
            p.x = Math.max(-limit, Math.min(limit, p.x));
          });
        }

        // 6. 动画循环（直接对底层 Float32Array 二进制指针进行改写，规避每帧分配矩阵对象的开销）
        const clock = new THREE.Clock();
        const matrixArray = mesh.instanceMatrix.array;

        function animate() {
          requestAnimationFrame(animate);

          const delta = Math.min(clock.getDelta(), 0.05);
          const elapsed = clock.getElapsedTime();

          if (!fallingEnabled) {
            renderer.render(scene, camera);
            return;
          }

          for (let i = 0; i < CONFIG.poolSize; i++) {
            const p = particles[i];

            // 物理下落更新
            p.x += p.velocityX * delta;
            p.y += p.velocityY * delta;
            const damping = Math.pow(CONFIG.burstDamping, delta * 60);
            p.velocityX *= damping;
            p.velocityY *= damping;
            p.y -= CONFIG.fallSpeed * p.speedMul * delta;
            if (p.y < CONFIG.positionY - CONFIG.fallDistance) {
              spawnParticle(p, i, false);
              uvRectAttr.needsUpdate = true;
            }
            p.rotation += CONFIG.rotationSpeed * p.rotationDir * delta;
          }

          separateParticles();

          for (let i = 0; i < CONFIG.poolSize; i++) {
            const p = particles[i];

            // 摇摆与缩放
            const windX =
              Math.sin(elapsed * CONFIG.windFrequency + p.windPhase) *
              CONFIG.windStrength;
            const currentX = p.x + windX;
            const s = p.scale;

            // 快速正余弦
            const cos = Math.cos(p.rotation) * s;
            const sin = Math.sin(p.rotation) * s;

            // 借助位运算 (i << 4) 极速定位当前实例在矩阵数组（16位）中的偏移量
            const idx = i << 4;

            matrixArray[idx] = cos;
            matrixArray[idx + 1] = sin;

            matrixArray[idx + 4] = -sin;
            matrixArray[idx + 5] = cos;

            matrixArray[idx + 10] = s; // Z 轴等比缩放

            matrixArray[idx + 12] = currentX; // 平移 X
            matrixArray[idx + 13] = p.y; // 平移 Y
            matrixArray[idx + 14] = p.z; // 平移 Z
          }

          mesh.instanceMatrix.needsUpdate = true;
          renderer.render(scene, camera);
        }

        animate();
      }

      init().catch((err) => console.error(err));
    </script>
  </body>
</html>
